name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repository (no write token).
permissions:
  contents: read

# Cancel superseded runs of the same workflow/ref instead of queueing them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Qt6 editor/tools on Linux; Windows/macOS build the Qt-free core.
          - os: ubuntu-latest
            with_qt: ON
          - os: windows-latest
            with_qt: OFF
          - os: macos-latest
            with_qt: OFF
    runs-on: ${{ matrix.os }}
    steps:
      # Pinned to the v4.2.2 commit SHA (immutable) — a moving tag could be repointed.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Qt6 (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev xvfb

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFUHGLGRAPHICS_WITH_QT=${{ matrix.with_qt }}

      - name: Build
        run: cmake --build build --config Release -j

      - name: Unit tests (label "unit" — no GL context required)
        run: ctest --test-dir build -C Release --output-on-failure -L unit

      # G12 MCP server smoke (Qt-free, built with FUHGLGRAPHICS_BUILD_TOOLS=ON): speak
      # JSON-RPC 2.0 over stdio — initialize, tools/list (procedural + render + water
      # tools present), tools/call render_set_param + procedural_noise + procedural_wfc.
      # Linux only (bash + .exe-less binary path).
      - name: MCP server smoke (stdio JSON-RPC)
        if: runner.os == 'Linux'
        run: |
          OUT=$(printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"render_set_param","arguments":{"name":"bloomThreshold","value":2.5}}}' \
            '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"procedural_noise","arguments":{"seed":1,"kind":"simplex2","x":0.5,"y":0.5}}}' \
            '{"jsonrpc":"2.0","id":5,"method":"tools/call","params":{"name":"procedural_wfc","arguments":{"preset":"dungeon","width":4,"height":4,"seed":2}}}' \
            | ./build/tools/mcp_server/fuhglgraphics_mcp_server)
          echo "$OUT"
          # initialize + tools/list answers are top-level JSON; tools/call payloads are
          # pretty-printed+escaped inside content[].text — match unquoted tokens there
          echo "$OUT" | grep -q '"protocolVersion"'
          echo "$OUT" | grep -q '"procedural_worldgen"'
          echo "$OUT" | grep -q '"render_set_effect"'
          echo "$OUT" | grep -q '"water_set_params"'
          echo "$OUT" | grep -q 'bloomThreshold'
          echo "$OUT" | grep -q '2\.5'
          echo "$OUT" | grep -q 'cells'

      # G12 asset creator Qt tool smoke: build + --version under xvfb (Linux, WITH_QT only)
      - name: Asset creator tool smoke (build + --version under xvfb)
        if: runner.os == 'Linux' && matrix.with_qt == 'ON'
        run: xvfb-run -a ./build/tools/asset_creator/fuhglgraphics_asset_creator --version

  # Headless GL smoke tests (label "gl_context") on Mesa llvmpipe via surfaceless EGL.
  # FUHGL_LINUX_BACKEND=EGL compiles FuhGLCore's EGL window backend, which provides the
  # surfaceless headless mode (FUHGL_BACKEND=surfaceless).
  gl-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Mesa EGL (llvmpipe) for headless GL
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libgl1-mesa-dri libegl-mesa0

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFUHGLGRAPHICS_WITH_QT=OFF -DFUHGL_LINUX_BACKEND=EGL

      - name: Build
        run: cmake --build build -j

      - name: Unit tests (label "unit")
        run: ctest --test-dir build --output-on-failure -L unit

      - name: Headless GL smoke tests (label "gl_context")
        run: FUHGL_BACKEND=surfaceless ctest --test-dir build --output-on-failure -L gl_context

  # Render the G3 reference screenshots (docs/images/) headless and upload them as an
  # artifact for review; the checked-in copies live in docs/images/.
  docs-screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Mesa EGL (llvmpipe) for headless GL
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libgl1-mesa-dri libegl-mesa0

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFUHGLGRAPHICS_WITH_QT=OFF -DFUHGL_LINUX_BACKEND=EGL

      - name: Build screenshot tools
        run: cmake --build build -j --target fuhglgraphics_screenshot fuhglgraphics_scene_screenshot fuhglgraphics_landscape_screenshot

      - name: Render G3 reference screenshots
        run: |
          mkdir -p docs/images/ci
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_screenshot --out docs/images/ci/g3_deferred_1280x720.png --width 1280 --height 720 --frames 24
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_screenshot --out docs/images/ci/g3_deferred_upscale_0.6.png --width 1280 --height 720 --frames 24 --scale 0.6
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_screenshot --out docs/images/ci/g3_deferred_nofx.png --width 1280 --height 720 --frames 24 --no-taa --no-tonemap --no-shadows --no-ibl

      - name: Render G9 scene-graph screenshots (effect comparisons)
        run: |
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_scene_screenshot --out docs/images/ci/g9_scene_graph.png --width 1280 --height 720 --frames 24
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_scene_screenshot --out docs/images/ci/g9_no_shadows.png --width 1280 --height 720 --frames 24 --no-shadows
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_scene_screenshot --out docs/images/ci/g9_no_ibl.png --width 1280 --height 720 --frames 24 --no-ibl
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_scene_screenshot --out docs/images/ci/g9_upscale_scale0.6.png --width 1280 --height 720 --frames 24 --scale 0.6
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_scene_screenshot --out docs/images/ci/g9_no_effects.png --width 1280 --height 720 --frames 24 --no-taa --no-tonemap --no-upscale --no-shadows --no-ibl

      - name: Render G9 landscape screenshots (cloud sky, sun, fog, god rays)
        run: |
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_landscape_screenshot --out docs/images/ci/g9_landscape_sky_sun_fog_rays.png --width 1280 --height 720 --frames 24
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_landscape_screenshot --out docs/images/ci/g9_landscape_no_rays.png --width 1280 --height 720 --frames 24 --no-rays

      - name: Render G9 landscape screenshots on the FuhGLCore shadow kit (PCSS/VSM/PCF/lamp)
        run: |
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_landscape_screenshot --out docs/images/ci/g9_landscape_shadowkit_pcss.png --width 1280 --height 720 --frames 24 --shadow-filter pcss --light-size 0.8
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_landscape_screenshot --out docs/images/ci/g9_landscape_shadowkit_vsm.png --width 1280 --height 720 --frames 24 --shadow-filter vsm
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_landscape_screenshot --out docs/images/ci/g9_landscape_shadowkit_pcf3x3.png --width 1280 --height 720 --frames 24 --shadow-filter pcf3x3 --cascade-blend 0
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_landscape_screenshot --out docs/images/ci/g9_landscape_shadowkit_lamp.png --width 1280 --height 720 --frames 24 --shadow-filter pcss --light-size 0.8 --point-shadows --contact-shadows

      - name: Build + render G5 particle screenshots (compute path on GL >= 4.3)
        run: |
          cmake --build build -j --target fuhglgraphics_particles_screenshot
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_particles_screenshot --out docs/images/ci/g5_particles_fire.png --kind fire --width 1280 --height 720 --frames 24
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_particles_screenshot --out docs/images/ci/g5_particles_smoke.png --kind smoke --width 1280 --height 720 --frames 24
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_particles_screenshot --out docs/images/ci/g5_particles_pollen.png --kind pollen --width 1280 --height 720 --frames 24
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_particles_screenshot --out docs/images/ci/g5_particles_all_nofx.png --kind all --width 1280 --height 720 --frames 24 --no-rays --no-shadows --no-particles

      - name: Build + render G6 animation screenshots (skinned arm + waving flag)
        run: |
          cmake --build build -j --target fuhglgraphics_animation_screenshot
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_animation_screenshot --out docs/images/ci/g6_animation_bend.png --time 0.55 --width 1280 --height 720 --frames 16
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_animation_screenshot --out docs/images/ci/g6_animation_straight.png --time 1.2 --frames 1 --width 1280 --height 720
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_animation_screenshot --out docs/images/ci/g6_animation_nofx.png --time 0.55 --width 1280 --height 720 --frames 16 --no-shadows --no-rays

      - name: Build + render G7 light-probe screenshots (SH grid, color bleeding)
        run: |
          cmake --build build -j --target fuhglgraphics_probes_screenshot
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_probes_screenshot --out docs/images/ci/g7_probes_on.png --width 1280 --height 720 --frames 16
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_probes_screenshot --out docs/images/ci/g7_probes_off.png --width 1280 --height 720 --frames 16 --no-probes
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_probes_screenshot --out docs/images/ci/g7_probes_nofx.png --width 1280 --height 720 --frames 16 --no-probes --no-shadows --no-rays

      - name: Build + render G8 decal screenshots (bullet holes + marking, material-ID gated)
        run: |
          cmake --build build -j --target fuhglgraphics_decals_screenshot
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_decals_screenshot --out docs/images/ci/g8_decals_on.png --width 1280 --height 720 --frames 16
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_decals_screenshot --out docs/images/ci/g8_decals_off.png --width 1280 --height 720 --frames 16 --no-decals
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_decals_screenshot --out docs/images/ci/g8_decals_nofx.png --width 1280 --height 720 --frames 16 --no-decals --no-shadows --no-rays

      - name: Build + render G10 screenshots (DoF bokeh + debug HUD)
        run: |
          cmake --build build -j --target fuhglgraphics_dof_screenshot
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_dof_screenshot --out docs/images/ci/g10_dof_on.png --width 1280 --height 720 --frames 16 --focus 9
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_dof_screenshot --out docs/images/ci/g10_dof_off.png --width 1280 --height 720 --frames 16 --focus 9 --no-dof
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_dof_screenshot --out docs/images/ci/g10_hud.png --width 1280 --height 720 --frames 16 --focus 9 --hud

      - name: Build + render G14 GPU-skinning screenshots (palette SSBO path on GL >= 4.3)
        run: |
          cmake --build build -j --target fuhglgraphics_gpu_skinning_screenshot
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_gpu_skinning_screenshot --out docs/images/ci/g14_gpu_skinning_on.png --width 1280 --height 720 --frames 16 --bend 1.05
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_gpu_skinning_screenshot --out docs/images/ci/g14_gpu_skinning_off.png --width 1280 --height 720 --frames 16 --bend 1.05 --cpu

      - name: Build + render G15 SSAO screenshots (ssao pass before lighting)
        run: |
          cmake --build build -j --target fuhglgraphics_ssao_screenshot
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_ssao_screenshot --out docs/images/ci/g15_ssao_on.png --width 1280 --height 720 --frames 16
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_ssao_screenshot --out docs/images/ci/g15_ssao_off.png --width 1280 --height 720 --frames 16 --no-ssao

      - name: Build + render G16 SSR screenshots (ssr pass after lighting)
        run: |
          cmake --build build -j --target fuhglgraphics_ssr_screenshot
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_ssr_screenshot --out docs/images/ci/g16_ssr_on.png --width 1280 --height 720 --frames 16
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_ssr_screenshot --out docs/images/ci/g16_ssr_off.png --width 1280 --height 720 --frames 16 --no-ssr

      - name: Build + render G17 bloom screenshots (bloom pass before TAA, adjustable threshold)
        run: |
          cmake --build build -j --target fuhglgraphics_bloom_screenshot
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_bloom_screenshot --out docs/images/ci/g17_bloom_on.png --width 1280 --height 720 --frames 16
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_bloom_screenshot --out docs/images/ci/g17_bloom_off.png --width 1280 --height 720 --frames 16 --no-bloom
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_bloom_screenshot --out docs/images/ci/g17_bloom_thr4.png --width 1280 --height 720 --frames 16 --threshold 4

      - name: Build + render G18 picking screenshots (marker at the picked point)
        run: |
          cmake --build build -j --target fuhglgraphics_picking_screenshot
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_picking_screenshot --out docs/images/ci/g18_picking_marker.png --width 1280 --height 720 --frames 16 --px 560 --py 400
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_picking_screenshot --out docs/images/ci/g18_picking_nomarker.png --width 1280 --height 720 --frames 16 --px 560 --py 400 --no-marker

      - name: Build + render G19 serialization screenshots (original vs. loaded from .json)
        run: |
          cmake --build build -j --target fuhglgraphics_serialization_screenshot
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_serialization_screenshot --prefix docs/images/ci/g19_serialization --width 1280 --height 720 --frames 16

      - name: Build + render G20 terrain+LOD screenshots (near = LOD 0, far = higher LOD)
        run: |
          cmake --build build -j --target fuhglgraphics_terrain_screenshot
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_terrain_screenshot --prefix docs/images/ci/g20_terrain --width 1280 --height 720 --frames 16

      - name: Build + render G21 volumetric fog screenshots (off / on / dense)
        run: |
          cmake --build build -j --target fuhglgraphics_volumetric_screenshot
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_volumetric_screenshot --prefix docs/images/ci/g21_volumetric --width 1280 --height 720 --frames 16

      - name: Build + render G22 wetness screenshots (dry / wet / puddles, SSR on)
        run: |
          cmake --build build -j --target fuhglgraphics_wetness_screenshot
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_wetness_screenshot --prefix docs/images/ci/g22_wetness --width 1280 --height 720 --frames 16

      - name: Build + render G23 tonemap screenshots (aces / reinhard / uncharted2 / linear / bloom-thr4)
        run: |
          cmake --build build -j --target fuhglgraphics_tonemap_screenshot
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_tonemap_screenshot --prefix docs/images/ci/g23_tonemap --width 1280 --height 720 --frames 16

      - name: Build + render G24 procedural-noise screenshots (noise-carved terrain + lake, noise cloud sky + IBL, sun/CSM/god rays, SSAO/volumetric/wetness/bloom)
        run: |
          cmake --build build -j --target fuhglgraphics_noise_screenshot
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_noise_screenshot --prefix docs/images/ci/g24_noise --width 1280 --height 720 --frames 16

      - name: Build + render G25 marching-cubes screenshots (noise-volume cave terrain, chunked; emissive crystals + bloom; dusk sky + IBL, sun/CSM/god rays, SSAO/volumetric)
        run: |
          cmake --build build -j --target fuhglgraphics_marching_cubes_screenshot
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_marching_cubes_screenshot --prefix docs/images/ci/g25_marching_cubes --width 1280 --height 720 --frames 16

      - name: Build + render G26 L-system screenshots (forest of L-system trees + ferns + instanced grass on noise terrain; sun/CSM/god rays, sky+IBL, SSAO/volumetric)
        run: |
          cmake --build build -j --target fuhglgraphics_lsystem_screenshot
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_lsystem_screenshot --prefix docs/images/ci/g26_lsystem --width 1280 --height 720 --frames 16
      - name: Build + render G27 WFC screenshots (WFC dungeon — torches+bloom, wear decals, CSM shadows, SSAO, volumetric fog; interior + top-down overview)
        run: |
          cmake --build build -j --target fuhglgraphics_wfc_screenshot
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_wfc_screenshot --prefix docs/images/ci/g27_wfc --width 1280 --height 720 --frames 16

      - name: Build + render G28 Voronoi screenshots (shattered plaza with glowing cracks + bloom, crystal cluster; sunset sky + IBL, sun/CSM/god rays, SSAO/volumetric)
        run: |
          cmake --build build -j --target fuhglgraphics_voronoi_screenshot
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_voronoi_screenshot --prefix docs/images/ci/g28_voronoi --width 1280 --height 720 --frames 16
      - name: Build + render G29 SDF-mandelbulb screenshots (fractal sculpture meshed via marching cubes, emissive + bloom, core point light, sun/CSM/god rays, SSAO/volumetric)
        run: |
          cmake --build build -j --target fuhglgraphics_mandelbulb_screenshot
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_mandelbulb_screenshot --prefix docs/images/ci/g29_mandelbulb --width 1280 --height 720 --frames 16
      - name: Build + render G30 creature screenshots (skeleton+SDF creatures with curvature vertex colors and baked scale maps, dusk sun/CSM/god rays, SSAO/bloom/volumetric)
        run: |
          cmake --build build -j --target fuhglgraphics_creature_screenshot
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_creature_screenshot --prefix docs/images/ci/g30_creature --width 1280 --height 720 --frames 16
      - name: Build + render G32 creature-showcase screenshots (three G32 blueprint creatures on procedural Corinthian columns, pitch-dark scene lit only by flickering torch point lights with G35 flame particles, SSAO/bloom/volumetric)
        run: |
          cmake --build build -j --target fuhglgraphics_creature_showcase
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_creature_showcase --prefix docs/images/ci/g32_creature_showcase --width 1280 --height 720 --frames 16
      - name: Build + render G37 vegetation-showcase screenshots (six eco-driven plants — meadow oak, dense-forest column, tropical drip-tip, desert succulent, wind-flagged coastal tree, autumn tree — with G33 SSS backlighting on the leaves, CSM shadows, sky IBL)
        run: |
          cmake --build build -j --target fuhglgraphics_vegetation_showcase
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_vegetation_showcase --prefix docs/images/ci/g37_vegetation --width 1280 --height 720 --frames 16

      # G31 pipeline shots (--mode pipeline, ~6500 houses) are flaky under headless llvmpipe
      # (occasionally an empty frame), so they are rendered into the manual/ subdir: uploaded
      # with the artifact but NOT PSNR-gated (screenshot_diff only lists the top level of
      # docs/images/ci); good runs are copied into docs/images/g31_pipeline{,_street}.png by hand.
      - name: Build + render G31 world-generator screenshots (generateWorld landscape heightmap+trees, WFC city + district plates; landscape/city overview + street level)
        run: |
          cmake --build build -j --target fuhglgraphics_worldgen_screenshot
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_worldgen_screenshot --prefix docs/images/ci/g31_worldgen --width 1280 --height 720 --frames 16 --seed 777 --mode both
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_worldgen_screenshot --prefix docs/images/ci/g31_worldgen --width 1280 --height 720 --frames 16 --seed 777 --mode village
          # cobblestone + wet streets showcase (POM parallax, reflective) as extra gated refs
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_worldgen_screenshot --prefix docs/images/ci/g31_cobble --width 1280 --height 720 --frames 16 --seed 777 --mode city --surface cobble --wet
          mkdir -p docs/images/ci/manual
          FUHGL_BACKEND=surfaceless ./build/examples/fuhglgraphics_worldgen_screenshot --prefix docs/images/ci/manual/g31 --width 1280 --height 720 --frames 16 --seed 777 --mode pipeline || true

      # G4: glTF demo needs a WITH_QT build (PNG/JPEG decode via QImage) + the CC0 demo
      # asset (Kenney, pinned commit — not vendored into the repo, see N7).
      - name: Install Qt6 (for the G4 glTF demo)
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev

      - name: Fetch demo asset (Kenney CC0, pinned to 3694c687)
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/shorepine/kenney.git /tmp/kenney
          git -C /tmp/kenney sparse-checkout set 3d/pirate
          git -C /tmp/kenney checkout 3694c6879e487c108f55677be7dd2ca75b07cc3b

      - name: Configure Qt build
        run: cmake -S . -B build-qt -DCMAKE_BUILD_TYPE=Release -DFUHGLGRAPHICS_WITH_QT=ON -DFUHGL_LINUX_BACKEND=EGL

      - name: Build glTF demo
        run: cmake --build build-qt -j --target fuhglgraphics_gltf_demo

      - name: Render G4 glTF screenshots
        run: |
          FUHGL_BACKEND=surfaceless QT_QPA_PLATFORM=offscreen ./build-qt/examples/fuhglgraphics_gltf_demo --model /tmp/kenney/3d/pirate/ship-pirate-medium.glb --out docs/images/ci/g4_gltf_ship.png --width 1280 --height 720 --frames 24 --azimuth 35 --elevation 14 --sun-azimuth 120 --sun-elevation 32
          FUHGL_BACKEND=surfaceless QT_QPA_PLATFORM=offscreen ./build-qt/examples/fuhglgraphics_gltf_demo --model /tmp/kenney/3d/pirate/ship-pirate-medium.glb --out docs/images/ci/g4_gltf_ship_no_shadows.png --width 1280 --height 720 --frames 24 --azimuth 35 --elevation 14 --sun-azimuth 120 --sun-elevation 32 --no-shadows
          FUHGL_BACKEND=surfaceless QT_QPA_PLATFORM=offscreen ./build-qt/examples/fuhglgraphics_gltf_demo --model /tmp/kenney/3d/pirate/ship-pirate-medium.glb --out docs/images/ci/g4_gltf_ship_no_ibl.png --width 1280 --height 720 --frames 24 --azimuth 35 --elevation 14 --sun-azimuth 120 --sun-elevation 32 --no-ibl
          FUHGL_BACKEND=surfaceless QT_QPA_PLATFORM=offscreen ./build-qt/examples/fuhglgraphics_gltf_demo --model /tmp/kenney/3d/pirate/chest.glb --out docs/images/ci/g4_gltf_chest.png --width 1280 --height 720 --frames 24 --size 1.6 --distance 4.2 --azimuth -35 --elevation 20 --sun-azimuth 145 --sun-elevation 38

      # G10: perceptual diff of the CI renders against the checked-in references
      # (docs/screenshot_diff.py, pure python3; PSNR threshold tolerates minor driver
      # differences — llvmpipe renders are deterministic).
      - name: Screenshot perceptual diff (CI renders vs docs/images references)
        run: python3 docs/screenshot_diff.py docs/images docs/images/ci --min-psnr 28

      # Lossless PNG recompression (smaller artifact + smaller checked-in references when
      # the ci renders are copied into docs/images/).
      - name: Compress rendered screenshots (optipng, lossless)
        run: |
          sudo apt-get update
          sudo apt-get install -y optipng
          optipng -o7 -quiet docs/images/ci/*.png

      - name: Upload screenshots
        if: always() # keep the artifact even when the PSNR diff fails (needed to update references)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: g3-screenshots
          path: docs/images/ci/
