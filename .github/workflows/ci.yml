name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repository (no write token).
permissions:
  contents: read

# Cancel superseded runs of the same workflow/ref instead of queueing them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Qt6 editor/tools on Linux; Windows/macOS build the Qt-free core.
          - os: ubuntu-latest
            with_qt: ON
          - os: windows-latest
            with_qt: OFF
          - os: macos-latest
            with_qt: OFF
    runs-on: ${{ matrix.os }}
    steps:
      # Pinned to the v4.2.2 commit SHA (immutable) — a moving tag could be repointed.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Qt6 (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFUHGLGRAPHICS_WITH_QT=${{ matrix.with_qt }}

      - name: Build
        run: cmake --build build --config Release -j

      - name: Unit tests (label "unit" — no GL context required)
        run: ctest --test-dir build -C Release --output-on-failure -L unit
